<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>RouteNote 作業用ページ</title></head><body><main><h1>RouteNote 作業用ページ</h1><p>管理者専用。アプリの通常画面ではありません。認可はサーバーで毎回確認します。</p><p>事前に承認された作業だけ実行してください。自動実行・自動再送はありません。結果不明の場合は再送せず停止してください。</p><button id="operator-login" type="button" disabled>Googleでログイン</button><p id="operator-status" role="status" aria-live="polite">ログインを確認しています。</p><section id="operator-controls" hidden><h2>読み取り確認</h2><button type="button" data-read="bootstrapPreflight">workspace.bootstrapPreflight</button><button type="button" data-read="pricingPreflight">workspace.pricingPreflight</button><h2>承認済みの一回操作</h2><form id="operator-form"><label>操作 <select name="action"><option value="bootstrap">workspace.bootstrap</option><option value="preparePricing">workspace.preparePricing</option><option value="activate">workspace.activate</option></select></label><p><label>サーバー側の作業設定と同じ operationId (UUID) <input name="operationId" autocomplete="off" required></label></p><label><input name="confirmed" type="checkbox" required>この操作と operationId を確認し、実行を承認済みです。</label><p><button type="submit">選択した操作を一度だけ実行</button></p></form></section><pre id="operator-result" aria-live="polite"></pre><p>このページはトークン・業務値・銀行情報を表示・保存しません。結果不明後の再読込や別ページからの再送もしないでください。</p></main><script type="module" src="./src/operator-page.js"></script></body></html>
